---
name: Release

# Tags every push to main with the next semantic version and publishes a GitHub release, so
# consumers (home-terraform's ansible/requirements.yml, kept current by Renovate) can pin a tag
# instead of a commit. The bump comes from the conventional-commit subjects since the last tag:
# "<type>!:" or a "BREAKING CHANGE" body is major, "feat" is minor, anything else is patch.
'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version.
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            # The first release; nothing to bump from.
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
            echo "HEAD is already tagged $last."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          log=$(git log "$last..HEAD" --format='%s%n%b')
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release.
        if: steps.version.outputs.tag != ''
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
